---
- name: Delete all A records for a specific subdomain
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ path_to_vault_file }}"

  tasks:
    - name: Fetch DNS records matching the target subdomain name
      linode.cloud.domain_record_info:
        api_token: "{{ linode_api_token }}"
        domain: "{{ root_domain }}"
        name: "{{ target_subdomain }}"  
      register: all_records

    - name: Delete matching subdomain A records
      linode.cloud.domain_record:
        api_token: "{{ linode_api_token }}"
        domain: "{{ root_domain }}"       
        record_id: "{{ item.id }}"       
        state: absent
      loop: "{{ all_records.record | default([]) }}" 
      when: item.type == 'A'
      loop_control:
        label: "Deleting A record ID: {{ item.id }} ({{ item.name }}.{{ root_domain }})"
