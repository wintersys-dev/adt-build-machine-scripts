[defaults]
# 1. PERMANENT INTERPRETER FIX: Forces Ansible to use your exact pipx environment binary
interpreter_python = ~/.local/share/pipx/venvs/ansible/bin/python

# 2. STDOUT CLEANUP: Drops 'ok: [localhost] =>' styling headers in favor of a clean, minimal output
stdout_callback = minimal

# 3. EXTRA CONFIGS (Recommended)
# Prevents host key validation blocks when connecting to your new instance for the first time
host_key_checking = False
