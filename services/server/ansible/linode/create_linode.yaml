---
# ========================================== 
# PLAY 1: Provision Infrastructure (Localhost)
# ==========================================

- name: Provision Linode Infrastructure
  hosts: localhost
  gather_facts: false
  vars:
    user_data_path: "{{ path_to_user_data }}"
  vars_files:
    - "{{ path_to_vault_file }}"

  tasks:
    - name: Create Linode instance with custom interfaces
      linode.cloud.instance:
        state: present
        api_token: "{{ linode_api_token }}"
        label: "{{ server_name }}"
        region: "{{ region }}"
        type: "{{ server_size }}"
        image: "{{ image }}"
        root_pass: "{{ emergency_password }}"
        disk_encryption: enabled
        metadata:
          user_data: "{{ lookup('ansible.builtin.file', user_data_path) }}"
        interface_generation: linode
        linode_interfaces:
          - vpc:
              subnet_id: "{{ subnet_id }}"
              ipv4:
                addresses:
                  - address: auto
                    primary: true
                    nat_1_1_address: auto
            firewall_id: "{{ firewall_id }}"
            default_route:
              ipv4: true
      register: linode_instance

    - name: Export clean variables to a local environment file
      ansible.builtin.copy:
        content: |
          PUBLIC_IP={{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].nat_1_1_address }}
          PRIVATE_IP={{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}
        dest: "{{ server_ips_file }}"
      delegate_to: localhost
      changed_when: false

    - name: Add newly created host dynamically to memory inventory
      ansible.builtin.add_host:
        name: "{{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}"
        groups: newly_created_vms
        ansible_port: 1035
        ansible_user: "{{ server_user }}"
        ansible_ssh_private_key_file: "{{ build_key }}"
        ansible_python_interpreter: /usr/bin/python3

    - name: Pause until the custom port is open (Using Private IP)
      ansible.builtin.wait_for:
        host: "{{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}"
        port: 1035
        state: started
        timeout: 300

    - name: Fetch SSH host keys from remote machine and add to known_hosts
      ansible.builtin.shell: |
        ssh-keyscan -p 1035 -H {{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }} >> ~/.ssh/known_hosts
      delegate_to: localhost
      changed_when: true

# ==========================================
# PLAY 2: Verify Remote Installation Success
# ==========================================


---
- name: Wait for cloud-init package installation with log tailing
  hosts: all
  gather_facts: no
  vars:
    cloud_init_timeout_seconds: 1200 # (give it twenty minutes which is a long time but if something is installing from source, it might be needed)

  tasks:
    - name: 1. Wait for SSH to accept connections
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: 2. Wait for cloud-init to finish installing packages and scripts
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      register: cloud_init_status
      async: "{{ cloud_init_timeout_seconds }}"
      poll: 10
      ignore_errors: yes  # Prevent the playbook from crashing instantly so we can tail the logs if it fails

    - name: 3. Tail the cloud-init-output.log file
      ansible.builtin.command: tail -n 30 /var/log/cloud-init-output.log
      register: cloud_init_tail
      changed_when: false
      # This ensures it always runs if cloud-init failed, or you can remove this line to always show the logs
      when: "'status: done' not in cloud_init_status.stdout"

    - name: 4. Display the last 30 lines of the output log
      ansible.builtin.debug:
        var: cloud_init_tail.stdout_lines
      when: "'status: done' not in cloud_init_status.stdout"

    - name: 5. Explicitly fail the playbook if cloud-init did not succeed
      ansible.builtin.fail:
        msg: "Cloud-init failed or timed out! Review the log tail outputted above."
      when: "'status: done' not in cloud_init_status.stdout"

    - name: 6. Safely gather facts (Only runs if cloud-init completed cleanly)
      ansible.builtin.gather_facts:

    - name: 7. Proceed with configuration management
      ansible.builtin.debug:
        msg: "Cloud-init finished cleanly. Proceeding with play..."


