---
# ========================================== 
# PLAY 1: Provision Infrastructure (Localhost)
# ==========================================

- name: Provision Linode Infrastructure
  hosts: localhost
  gather_facts: false
  vars:
    user_data_path: "{{ path_to_user_data }}"
  vars_files:
    - "{{ path_to_vault_file }}"

  tasks:
    - name: Create Linode instance with custom interfaces
      linode.cloud.instance:
        state: present
        api_token: "{{ linode_api_key }}"
        label: "{{ server_name }}"
        region: "{{ region }}"
        type: "{{ server_size }}"
        image: "{{ image }}"
        root_pass: "{{ emergency_password }}"
        disk_encryption: enabled
        metadata:
          user_data: "{{ lookup('ansible.builtin.file', user_data_path) }}"
        interface_generation: linode
        linode_interfaces:
          - vpc:
              subnet_id: "{{ subnet_id }}"
              ipv4:
                addresses:
                  - address: auto
                    primary: true
                    nat_1_1_address: auto
            firewall_id: "{{ firewall_id }}"
            default_route:
              ipv4: true
      register: linode_instance

    - name: Export clean variables to a local environment file
      ansible.builtin.copy:
        content: |
          PUBLIC_IP={{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].nat_1_1_address }}
          PRIVATE_IP={{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}
        dest: "{{ server_ips_file }}"
      delegate_to: localhost
      changed_when: false

    - name: Add newly created host dynamically to memory inventory
      ansible.builtin.add_host:
        name: "{{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}"
        groups: newly_created_vms
        ansible_port: 1035
        ansible_user: "{{ server_user }}"
        ansible_ssh_private_key_file: "{{ build_key }}"
        ansible_python_interpreter: /usr/bin/python3

    - name: Pause until the custom port is open (Using Private IP)
      ansible.builtin.wait_for:
        host: "{{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}"
        port: 1035
        state: started
        timeout: 300

    - name: Fetch SSH host keys from remote machine and add to known_hosts
      ansible.builtin.shell: |
        ssh-keyscan -p 1035 -H {{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }} >> ~/.ssh/known_hosts
      delegate_to: localhost
      changed_when: true

# ==========================================
# PLAY 2: Verify Remote Installation Success
# ==========================================

- name:  Verify Remote Installation Success
  hosts: newly_created_vms
  
  vars:
    target_file: /home/{{ ansible_user }}/runtime/WEBSERVER_READY
    max_attempts: 40  # 40 attempts * 30 seconds = 20 minutes maximum wait

  tasks:
    - name: Loop to check for file existence
      ansible.builtin.include_tasks: check_file.yaml
      loop: "{{ range(1, (max_attempts | int) + 1) | list }}"
      loop_control:
        loop_var: attempt
      when: not (file_check.stat.exists | default(false))

    - name: Notify that the marker file was not found
      ansible.builtin.debug:
        msg: "The marker file indicating that the machine has correctly provisioned has not been found...Exiting"
      when: not (file_check.stat.exists | default(false))

    - name: Gracefully exit play for this host if file was not found
      ansible.builtin.meta: end_host
      when: not (file_check.stat.exists | default(false))

    - name: Continue with next task
      ansible.builtin.debug:
        msg: "The marker file indicating that the machine has correctly provisioned has been found...Continuing"
