---
# ========================================== 
# PLAY 1: Provision Infrastructure (Localhost)
# ==========================================

- name: Provision Linode Infrastructure
  hosts: localhost
  gather_facts: false
  vars:
    user_data_path: "{{ path_to_user_data }}"
  vars_files:
    - "{{ path_to_vault_file }}"

  tasks:
    - name: Create Linode instance with custom interfaces
      linode.cloud.instance:
        state: present
        api_token: "{{ linode_api_token }}"
        label: "{{ server_name }}"
        region: "{{ region }}"
        type: "{{ server_size }}"
        image: "{{ image }}"
        root_pass: "{{ emergency_password }}"
        disk_encryption: enabled
        metadata:
          user_data: "{{ lookup('ansible.builtin.file', user_data_path) }}"
        interface_generation: linode
        linode_interfaces:
          - vpc:
              subnet_id: "{{ subnet_id }}"
              ipv4:
                addresses:
                  - address: auto
                    primary: true
                    nat_1_1_address: auto
            firewall_id: "{{ firewall_id }}"
            default_route:
              ipv4: true
      register: linode_instance

    - name: Export clean variables to a local environment file
      ansible.builtin.copy:
        content: |
          PUBLIC_IP={{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].nat_1_1_address }}
          PRIVATE_IP={{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}
        dest: "{{ server_ips_file }}"
      delegate_to: localhost
      changed_when: false

    - name: Add newly created host dynamically to memory inventory
      ansible.builtin.add_host:
        name: "{{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}"
        groups: newly_created_vms
        ansible_port: 1035
        ansible_user: "{{ server_user }}"
        ansible_ssh_private_key_file: "{{ build_key }}"
        ansible_python_interpreter: /usr/bin/python3

    - name: Pause until the custom port is open (Using Private IP)
      ansible.builtin.wait_for:
        host: "{{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }}"
        port: 1035
        state: started
        timeout: 300

    - name: Fetch SSH host keys from remote machine and add to known_hosts
      ansible.builtin.shell: |
        ssh-keyscan -p 1035 -H {{ linode_instance.linode_interfaces[0].vpc.ipv4.addresses[0].address }} >> ~/.ssh/known_hosts
      delegate_to: localhost
      changed_when: true

# ==========================================
# PLAY 2: Verify Remote Installation Success
# ==========================================

- name:  Verify Remote Installation Success
  hosts: newly_created_vms
  gather_facts: false
  vars:
    target_file_path: "/home/{{ ansible_user }}/runtime/WEBSERVER_READY"

  tasks:
    - name: "Checking for file {{ target_file_path }} on {{ inventory_hostname }}....when found, {{ server_name }} is built successfully"
      ansible.builtin.stat:
        path: "{{ target_file_path }}"
      register: file_status
      until: file_status.stat.exists
      retries: 40
      delay: 30
      ignore_errors: true  
      loop_control:
        label: >-
          [Attempt {{ file_status.attempts | default(1) }} of 40]
          Host: {{ inventory_hostname }} |
          Status: {{ 'FOUND' if file_status.stat.exists | default(false) else 'NOT FOUND' }}

    - name: Print success message
      ansible.builtin.debug:
        msg: "SUCCESS: Found '{{ target_file_path }}' on {{ inventory_hostname }}!"
      when: file_status.stat.exists

    - name: Final error block if the file was never found
      ansible.builtin.fail:
        msg: "FAILURE: Exceeded 40 attempts. The file '{{ target_file_path }}' does not exist on any target server."
      when:
        - ansible_play_batch | last == inventory_hostname
        - not file_status.stat.exists

    - name: Continue with next task
      ansible.builtin.debug:
        msg: "The marker file indicating that the machine has correctly provisioned has been found...Continuing"
