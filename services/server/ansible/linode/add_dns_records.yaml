---
- name: Extract Public IP from file, validate format, and update Linode DNS
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Ensure Linode API token is provided
      ansible.builtin.fail:
        msg: "Please set the LINODE_API_TOKEN environment variable."
      when: linode_api_token is not defined or linode_api_token == ""

    - name: Parse Public IP directly from plain text file
      ansible.builtin.set_fact:
        public_ip: "{{ lookup('ansible.builtin.file', ip_file_path) | regex_search('^PUBLIC_IP=(.+)$', '\\1', multiline=True) | first | default(none) }}"

    - name: Fail if Public IP could not be parsed
      ansible.builtin.fail:
        msg: "Could not find a valid PUBLIC_IP entry in {{ ip_file_path }}."
      when: public_ip is none or public_ip == ""

    - name: Validate that public_ip is a correctly formatted IPv4 address
      ansible.builtin.fail:
        msg: "The parsed value '{{ public_ip }}' is not a valid IPv4 address."
      # Matches standard 0-255 octets for structural accuracy
      when: not (public_ip | regex_search('^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'))

    - name: Get the Domain ID for the target domain
      ansible.builtin.uri:
        url: "https://linode.com"
        method: GET
        headers:
          Authorization: "Bearer {{ linode_api_token }}"
          Accept: "application/json"
      register: domains_response

    - name: Set Domain ID fact
      ansible.builtin.set_fact:
        domain_id: "{{ (domains_response.json.data | selectattr('domain', 'equalto', target_domain) | map(attribute='id') | list) | default(none) }}"

    - name: Fail if domain is not found in Linode Account
      ansible.builtin.fail:
        msg: "Domain {{ target_domain }} was not found in your Linode account."
      when: domain_id is none

    - name: Add the new A record to Linode DNS
      ansible.builtin.uri:
        url: "https://linode.com/{{ domain_id }}/records"
        method: POST
        headers:
          Authorization: "Bearer {{ linode_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "A"
          name: "{{ record_subdomain }}"
          target: "{{ public_ip }}"
          ttl_sec: 300
        status_code: 200
      register: dns_create_response

    - name: Output completion message
      ansible.builtin.debug:
        msg: "Successfully added A record for {{ target_domain }} pointing to {{ public_ip }} (Record ID: {{ dns_create_response.json.id }})."
