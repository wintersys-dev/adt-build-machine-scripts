---
- name: "Checking for file (Attempt {{ attempt }}/{{ max_attempts }})"
  ansible.builtin.stat:
    path: "{{ target_file }}"
  register: file_check

- name: "Success Update"
  ansible.builtin.debug:
    msg: "Success! The file [{{ target_file }}] was successfully found on attempt {{ attempt }}."
  when: file_check.stat.exists

- name: "Exit loop immediately if file is found"
  ansible.builtin.meta: end_host
  when: file_check.stat.exists

- name: "Status Update (Attempt {{ attempt }}/{{ max_attempts }})"
  ansible.builtin.debug:
    msg: "File [{{ target_file }}] is still missing. Retrying in 30 seconds..."
  when: not file_check.stat.exists

- name: Pause for 30 seconds
  ansible.builtin.pause:
    seconds: 30
  when:
    - not file_check.stat.exists
    - attempt | int < max_attempts | int

- name: Fail if file never appeared
  ansible.builtin.fail:
    msg: "Timeout: The file [{{ target_file }}] did not appear within the maximum wait time."
  when:
    - attempt | int == max_attempts | int
    - not file_check.stat.exists
