---
- name: Add a new IP address record to Linode DNS using official modules
  hosts: localhost
  gather_facts: false
  vars:
    # Pass your token in your environment shell: export LINODE_API_TOKEN="your_token"
    linode_api_token: "{{ lookup('ansible.builtin.env', 'LINODE_API_TOKEN') }}"
    target_domain: "example.com"
    
    # Define the record details you want to add
    new_record_type: "A"            # Use "A" for IPv4 or "AAAA" for IPv6
    new_record_name: "www"          # Leave blank/omitted or use "@" for the root domain
    new_record_target: "192.0.2.5"  # The IP address you are adding

  tasks:
    - name: Verify Linode API token presence
      ansible.builtin.fail:
        msg: "The LINODE_API_TOKEN environment variable is missing."
      when: linode_api_token is not defined or linode_api_token | trim == ""

    - name: Fetch domain metadata to extract internal ID
      linode.cloud.domain_info:
        api_token: "{{ linode_api_token }}"
        domain: "{{ target_domain }}"
      register: target_domain_details

    - name: Add the new IP address record to the DNS zone
      linode.cloud.domain_record:
        api_token: "{{ linode_api_token }}"
        domain_id: "{{ target_domain_details.domains.id }}"
        type: "{{ new_record_type }}"
        name: "{{ new_record_name }}"
        target: "{{ new_record_target }}"
        state: present
      register: record_creation_result
      when: target_domain_details.domains | length > 0

    - name: Print success summary
      ansible.builtin.debug:
        msg: >
          Successfully added {{ new_record_type }} record for 
          {{ new_record_name }}.{{ target_domain }} pointing to {{ new_record_target }}.
      when: record_creation_result.changed
