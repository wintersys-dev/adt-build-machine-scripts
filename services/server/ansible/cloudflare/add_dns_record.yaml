---
- name: Add A record for a specific subdomain
  hosts: localhost
  gather_facts: false
  vars:
  vars_files:
    - "{{ path_to_vault_file }}"

  tasks:
    - name: Orchestration Block - Route to correct A record creation handler
      block:
        # ---- PATH A: SCOPED API TOKEN ----
        - name: Route to Scoped API Token workflow
          ansible.builtin.include_tasks: delete_dns_records_token.yaml
          when: 
            - cloudflare_api_token is defined
            - cloudflare_api_token | trim | length > 0

        # ---- PATH B: LEGACY GLOBAL API KEY ----
        - name: Route to Legacy Global API Key workflow
          ansible.builtin.include_tasks: delete_dns_records_key.yaml
          when:
            - cloudflare_api_token is not defined or (cloudflare_api_token | trim | length == 0)
            - cloudflare_global_api_key is defined and (cloudflare_global_api_key | trim | length > 0)
            - cloudflare_email is defined and (cloudflare_email | trim | length > 0)

      rescue:
        - name: Fail gracefully if no valid credential mix was provided
          ansible.builtin.fail:
            msg: >
              Orchestration halted: Invalid credential mix provided. 
              Please define either 'cloudflare_api_token' OR both 
              'cloudflare_global_api_key' and 'cloudflare_email'.
