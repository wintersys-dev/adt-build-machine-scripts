#---
#- name: Purge all A records for a specific subdomain
#  hosts: localhost
#  gather_facts: false
#  vars:
#  vars_files:
#    - "{{ path_to_vault_file }}"


  tasks:
    - name: Fetch all existing A records for the target subdomain
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_auth_zone_id }}/dns_records?type=A&name={{ full_domain }}"
        method: GET
        headers:
          X-Auth-Email: "{{ cloudflare_email }}"
          X-Auth-Key: "{{ cloudflare_global_api_key }}"
          Content-Type: "application/json"
        status_code: 200
      register: cloudflare_dns_records

    - name: Delete each matching A record found
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_auth_zone_id }}/dns_records/{{ item.id }}"
        method: DELETE
        headers:
          X-Auth-Email: "{{ cloudflare_email }}"
          X-Auth-Key: "{{ cloudflare_global_api_key }}"
          Content-Type: "application/json"
        status_code: 200
      loop: "{{ cloudflare_dns_records.json.result }}"
      # Securely verify that the API returned valid DNS items before starting the loop
      when: cloudflare_dns_records.json.result is defined and cloudflare_dns_records.json.result | length > 0
      loop_control:
        label: "Deleting A record pointing to {{ item.content }}"
