---
- name: Add an A record for a specific subdomain
  hosts: localhost
  gather_facts: false
  vars:
  vars_files:
    - "{{ path_to_vault_file }}"


  tasks:
    - name: Create the new DNS record
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_auth_zone_id }}/dns_records"
        method: POST
        headers:
          X-Auth-Email: "{{ cloudflare_email }}"
          X-Auth-Key: "{{ cloudflare_global_api_key }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "A"
          name: "{{ full_domain }}"
          content: "{{ ip_address }}" 
          ttl: 1
          proxied: false
        status_code: 
          - 200
          - 201
