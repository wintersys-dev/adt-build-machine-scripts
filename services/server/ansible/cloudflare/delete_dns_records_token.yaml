---
- name: Purge all A records for a specific subdomain
  hosts: localhost
  gather_facts: false
  vars:
    # Replace these with your actual Cloudflare credentials and domain details
    #cloudflare_api_token: "YOUR_CLOUDFLARE_API_TOKEN"
    #cloudflare_zone_id: "YOUR_ZONE_ID"
    #subdomain_name: "subdomain.example.com"
  vars_files:
    - "{{ path_to_vault_file }}"

  tasks:
    - name: Fetch all existing A records for the target subdomain
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records?type=A&name={{ subdomain_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        status_code: 200
      register: cloudflare_dns_records

    - name: Delete each matching A record found
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        status_code: 200
      loop: "{{ cloudflare_dns_records.json.result }}"
      when: cloudflare_dns_records.json.result | length > 0
      loop_control:
        label: "Deleting A record pointing to {{ item.content }}"
