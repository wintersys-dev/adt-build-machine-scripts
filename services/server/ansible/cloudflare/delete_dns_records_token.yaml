#---
#- name: Purge all A records for a specific subdomain using API Token
#  hosts: localhost
#  gather_facts: false
#  vars_files:
#    - "{{ path_to_vault_file }}"

  tasks:
    - name: Fetch all existing A records for the target subdomain
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_auth_zone_id }}/dns_records?type=A&name={{ full_domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        status_code: 200
      register: cloudflare_dns_records

    - name: Delete each matching A record found
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_auth_zone_id }}/dns_records/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        status_code: 
          - 200
          - 204
      loop: "{{ cloudflare_dns_records.json.result | default([]) }}"
      when: 
        - cloudflare_dns_records.json.result is defined
        - item.id is defined
        - item.id | length > 0
      loop_control:
        label: "Deleting A record pointing to {{ item.content }}"

