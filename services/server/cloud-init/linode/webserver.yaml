#cloud-config
manage_resolv_conf: true
resolv_conf:
  nameservers:
    - '9.9.9.9'
    - '1.1.1.2'
    - '8.8.8.8'
    - '8.8.4.4'

users:
  - name: XXXXSERVER_USERXXXX
    passwd: 'XXXXSERVER_USER_PASSWORDXXXX'
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - 'XXXXSSH_PUBLIC_KEYXXXX'

ssh_pwauth: false

ssh_keys:
  XXXXALGORITHMXXXX_private: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    XXXXSSH_PRIVATE_KEYXXXX
    -----END OPENSSH PRIVATE KEY-----

timezone: 'XXXXTIMEZONEXXXX'
hostname: XXXXWEBSERVER_HOSTNAMEXXXX
manage_etc_hosts: true

keyboard:
  layout: gb

#locale: "en_GB.UTF-8"

# FIX: Pre-create directories early so write_files modules don't fail on missing parent paths
bootcmd:
  - mkdir -p /home/XXXXSERVER_USERXXXX/runtime
  - mkdir -p /home/XXXXSERVER_USERXXXX/.ssh
 # - chown -R 1000:1000 /home/XXXXSERVER_USERXXXX 2>/dev/null || true
  - DEBIAN_FRONTEND=noninteractive apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nala


write_files:
  - encoding: gzip+b64
    content: XXXXWEBSERVER_CONFIGURATIONXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/webserver_configuration_settings.dat
    permissions: '0640'

  - encoding: gzip+b64
    content: XXXXBUILDSTYLES_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/software.dat
    permissions: '0640'

  - encoding: gzip+b64
    content: XXXXFIREWALL_PORT_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/firewall.dat
    permissions: '0640'

  - encoding: gzip+b64
    content: XXXXAPPLICATION_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/application.dat
    permissions: '0640'

  - content: /home/XXXXSERVER_USERXXXX
    owner: root:root
    path: /home/homedir.dat
    permissions: '0644'

  - content: |
      ClientAliveInterval 60
      ClientAliveCountMax 2
    path: /home/XXXXSERVER_USERXXXX/.ssh/config
    owner: XXXXSERVER_USERXXXX:root
    permissions: '0600'

  - content: |
      Port XXXXSSH_PORTXXXX
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root:root
    permissions: '0644'

#DBAAS_CERT  - encoding: b64
#DBAAS_CERT    content: XXXXDBAAS_CERTXXXX
#DBAAS_CERT    owner: root:root
#DBAAS_CERT    path: /home/XXXXSERVER_USERXXXX/runtime/DBaaS_CERT
#DBAAS_CERT    permissions: '0644'

runcmd:
  - [ sh, -c, "systemctl restart ssh || systemctl restart sshd" ]
  - [ nala, fetch, --auto, "yes" ]
  - [ nala, update ]
  - [ nala, install, -y, grub-efi-amd64, git, network-manager, jq, rsync, cron, zip, unzip, bzip2, gawk, gnupg, golang-go, inotify-tools, ipcalc, ipset,  qrencode, rclone, socat, wireguard]
  # Ensure target directory ownership is sound before cloning/running scripts
  - chown -R XXXXSERVER_USERXXXX:root /home/XXXXSERVER_USERXXXX/runtime
  - chown -R XXXXSERVER_USERXXXX:root /home/XXXXSERVER_USERXXXX/.ssh
  # Safe explicit file copies without relying on unsafe directory generation assumptions
  - cp /etc/ssh/ssh_host_XXXXALGORITHMXXXX_key /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX
  - cp /etc/ssh/ssh_host_XXXXALGORITHMXXXX_key.pub /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX.pub
#  - chmod 700 /home/XXXXSERVER_USERXXXX/.ssh
#  - chmod 600 /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX
#  - chmod 644 /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX.pub
#  - chown -R XXXXSERVER_USERXXXX:root /home/XXXXSERVER_USERXXXX/.ssh
  # Clone and execute deployment workflow
  - git clone -b XXXXGIT_BRANCHXXXX --single-branch https://XXXXGIT_PROVIDER_DOMAINXXXX/XXXXINFRASTRUCTURE_REPOSITORY_OWNERXXXX/adt-webserver-scripts.git /home/XXXXSERVER_USERXXXX/clone
  - rsync -a --remove-source-files /home/XXXXSERVER_USERXXXX/clone/ /home/XXXXSERVER_USERXXXX && rm -r /home/XXXXSERVER_USERXXXX/clone
 #Turn these into one script :InstallAdditionalSoftware and call it from here this script test the conditions in software.dat and actions installation accordingly
  - |
    export HOME="/home/XXXXSERVER_USERXXXX"
    sh "${HOME}/utilities/security/EnforcePermissions.sh"
    sh "${HOME}/installation/InstallPackageManager.sh"
    sh "${HOME}/installation/InstallApplicationLanguage.sh"
    sh "${HOME}/installation/InstallEmailUtil.sh"
    sh "${HOME}/installation/InstallFirewall.sh"
    sh "${HOME}/installation/InstallTextBrowser.sh"
    sh "${HOME}/installation/InstallVirusScanner.sh"
    sh "${HOME}/installation/InstallDatastoreTools.sh"
    sh "${HOME}/installation/InstallDatabaseClient.sh"
    sh "${HOME}/installation/InstallWebserver.sh"
    sh "${HOME}/ws.sh"
