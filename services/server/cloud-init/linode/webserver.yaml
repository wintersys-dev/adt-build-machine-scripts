#cloud-config
manage_resolv_conf: true
resolv_conf:
  nameservers:
    - '9.9.9.9'
    - '1.1.1.2'
    - '8.8.8.8'
    - '8.8.4.4'

users:
  - name: XXXXSERVER_USERXXXX
    passwd: 'XXXXSERVER_USER_PASSWORDXXXX'
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - 'XXXXSSH_PUBLIC_KEYXXXX'

ssh_pwauth: false

# Ensure XXXXALGORITHMXXXX translates to rsa, dsa, ecdsa, or ed25519
ssh_keys:
  XXXXALGORITHMXXXX_private: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    XXXXSSH_PRIVATE_KEYXXXX
    -----END OPENSSH PRIVATE KEY-----

timezone: 'XXXXTIMEZONEXXXX'
hostname: XXXXWEBSERVER_HOSTNAMEXXXX
manage_etc_hosts: true

keyboard:
  layout: gb

locale: "en_GB.UTF-8"

write_files:
  - encoding: gzip+b64
    content: XXXXWEBSERVER_CONFIGURATIONXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/webserver_configuration_settings.dat
    permissions: '0640'
    defer: true

  - encoding: gzip+b64
    content: XXXXBUILDSTYLES_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/software.dat
    permissions: '0640'
    defer: true

  - encoding: gzip+b64
    content: XXXXFIREWALL_PORT_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/firewall.dat
    permissions: '0640'
    defer: true

#DBAAS_CERT  - encoding: b64
#DBAAS_CERT    content: XXXXDBAAS_CERTXXXX
#DBAAS_CERT    owner: root:root
#DBAAS_CERT    path: /home/XXXXSERVER_USERXXXX/runtime/DBaaS_CERT
#DBAAS_CERT    permissions: '0644'
#DBAAS_CERT    defer: true

  - encoding: gzip+b64
    content: XXXXAPPLICATION_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/application.dat
    permissions: '0640'
    defer: true

  - content: /home/XXXXSERVER_USERXXXX
    owner: root:root
    path: /home/homedir.dat
    permissions: '0644'
    defer: true

  - content: |
      ClientAliveInterval 60
      ClientAliveCountMax 2
    path: /home/XXXXSERVER_USERXXXX/.ssh/config
    owner: XXXXSERVER_USERXXXX:XXXXSERVER_USERXXXX  # Fixed: Changed from root to user
    permissions: '0600'
    defer: true
    
  - content: |
      Port XXXXSSH_PORTXXXX
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root:root
    permissions: '0644'
    defer: true

packages:
  - grub-efi-amd64
  - git
  - network-manager
  - jq
  - rsync
  - cron
  - zip
  - unzip
  - bzip2
  - gawk 
  - gnupg 
  - golang-go 
  - inotify-tools 
  - ipcalc 
  - ipset 
  - qrencode 
  - rclone 
  - socat 
  - wireguard


runcmd:
  - systemctl restart ssh || systemctl restart sshd
  - cp /etc/ssh/ssh_host_XXXXALGORITHMXXXX_key /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX
  - cp /etc/ssh/ssh_host_XXXXALGORITHMXXXX_key.pub /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX.pub
  - chmod 750 /home/XXXXSERVER_USERXXXX/.ssh
  - chmod 600 /home/XXXXSERVER_USERXXXX/.ssh/id_XXXXALGORITHMXXXX_AGILE_DEPLOYMENT_BUILD_KEY_XXXXBUILD_IDENTIFIERXXXX*
  - git clone -b XXXXGIT_BRANCHXXXX --single-branch https://XXXXGIT_PROVIDER_DOMAINXXXX/XXXXINFRASTRUCTURE_REPOSITORY_OWNERXXXX/adt-webserver-scripts.git /home/XXXXSERVER_USERXXXX/clone
  - rsync -a --remove-source-files /home/XXXXSERVER_USERXXXX/clone/ /home/XXXXSERVER_USERXXXX
  - |
    TARGET_HOME="/home/XXXXSERVER_USERXXXX"
#    sh "${TARGET_HOME}/utilities/software/InitialiseToolkitForDevelopment.sh"
    sh "${TARGET_HOME}/installation/InstallPackageManager.sh"
    sh "${TARGET_HOME}/installation/InstallApplicationLanguage.sh"
    sh "${TARGET_HOME}/installation/InstallEmailUtil.sh"
    sh "${TARGET_HOME}/installation/InstallFirewall.sh"
    sh "${TARGET_HOME}/installation/InstallTextBrowser.sh"
    sh "${TARGET_HOME}/installation/InstallVirusScanner.sh"
    sh "${TARGET_HOME}/installation/InstallDatastoreTools.sh"
    sh "${TARGET_HOME}/installation/InstallDatabaseClient.sh"
    sh "${TARGET_HOME}/installation/InstallWebserver.sh" 
    sh "${TARGET_HOME}/ws.sh" 
