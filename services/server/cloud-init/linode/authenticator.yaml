#cloud-config

manage_resolv_conf: true
resolv_conf:
  nameservers:
    - '9.9.9.9'
    - '1.1.1.2'
    - '8.8.8.8'
    - '8.8.4.4'

ssh_service:
  manage_service: true
  stop_on_shutdown: false
  service_name: ssh

users:
  - name: XXXXSERVER_USERXXXX
    passwd: 'XXXXSERVER_USER_PASSWORDXXXX'
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - 'XXXXSSH_PUBLIC_KEYXXXX'

ssh_pwauth: false

timezone: 'XXXXTIMEZONEXXXX'
hostname: XXXXAUTHENTICATOR_HOSTNAMEXXXX
manage_etc_hosts: true

keyboard:
  layout: gb

write_files:
  - encoding: gzip+b64
    content: XXXXAUTHENTICATOR_CONFIGURATIONXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/webserver_configuration_settings.dat
    permissions: '0640'
    defer: true

  - encoding: gzip+b64
    content: XXXXBUILDSTYLES_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/software.dat
    permissions: '0640'
    defer: true

  - encoding: gzip+b64
    content: XXXXFIREWALL_PORT_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/firewall.dat
    permissions: '0640'
    defer: true

  - content: /home/XXXXSERVER_USERXXXX
    owner: root:root
    path: /home/homedir.dat
    permissions: '0644'
    defer: true

  - content: |
      ClientAliveInterval 60
      ClientAliveCountMax 2
    path: /home/XXXXSERVER_USERXXXX/.ssh/config
    owner: 'root:root'
    permissions: '0600'
    defer: true

  - content: |
      Port XXXXSSH_PORTXXXX
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root:root
    permissions: '0644'
    defer: true

packages:
  - grub-efi-amd64
  - git
  - network-manager
  - jq
  - rsync
  - cron
  - zip
  - unzip

runcmd:
  - systemctl restart ssh || systemctl restart sshd
