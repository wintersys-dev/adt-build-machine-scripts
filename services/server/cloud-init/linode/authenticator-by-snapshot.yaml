#cloud-config

users:
  - name: XXXXSERVER_USERXXXX
    passwd: 'XXXXSERVER_USER_PASSWORDXXXX'
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false

hostname: XXXXAUTHENTICATOR_HOSTNAMEXXXX

ssh_pwauth: false

write_files:
  - encoding: gzip+b64
    content: XXXXAUTHENTICATOR_CONFIGURATIONXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/webserver_configuration_settings.dat
    permissions: '0750'

  - encoding: gzip+b64
    content: XXXXBUILDSTYLES_SETTINGSXXXX
    owner: XXXXSERVER_USERXXXX:root
    path: /home/XXXXSERVER_USERXXXX/runtime/software.dat
    permissions: '0750'

runcmd:
  - locale-gen en_GB.UTF-8
  - update-locale LANG=en_GB.UTF-8
  - export HOME=/home/XXXXSERVER_USERXXXX && /bin/sh ${HOME}/installation/Update.sh
  - chmod 755 /home/XXXXSERVER_USERXXXX /home/XXXXSERVER_USERXXXX/runtime
  - chown -R XXXXSERVER_USERXXXX:root /home/XXXXSERVER_USERXXXX
  - /home/XXXXSERVER_USERXXXX/utilities/processing/RunServiceCommand.sh "ssh" restart
  - /home/XXXXSERVER_USERXXXX/utilities/processing/RunServiceCommand.sh "cron" restart
  - /bin/sh /home/XXXXSERVER_USERXXXX/security/ResetFirewall.sh

